# Eval-runner contract per FE refinement §20.
# Repo: attendance-portal frontend
team: TBD-set-team-name
schema_version: 1

stack:
  frontend: angular@19
  backend: dotnet@8
  database: mariadb@10  # backend's call; FE is BE-agnostic

entrypoint:
  eval: make eval
  dev: npm run start
  install: npm ci
  build: make build
  test: make test
  e2e: make e2e

api_contract:
  source: ../hackathon-may-2026-attendance-portal/dev-extras/integration/api-reference.yaml

# Per FE refinement §20: high-risk paths array — paths an AI security pass scrutinises.
high_risk_paths:
  - src/features/auth/                                  # auth flow
  - src/features/absences/presentation/                 # file upload UX
  - src/features/documents/presentation/                # PDF preview iframe
  - src/features/reports/presentation/                  # export download
  - src/shared/http/interceptors/                       # auth header, retry, breaker

# Bonus axes declared (per product-spec §14 + FE refinement)
bonus_declared:
  - i18n-en          # multi-language UI: catalogue + locale toggle (sk/en)
  - pwa              # installable shell + service worker + offline banner
  - keyboard-shortcuts  # ? opens overlay; g d|b|n|a|c|h|s chords; Esc closes
  - print-styles     # @media print: light theme, ink-friendly tables, hidden chrome
  - etag-conflict    # If-Match round-trip, 409 toast, cache invalidation
  - oidc             # angular-oauth2-oidc, PKCE code flow, silent refresh,
                     # session-guard (30min idle / 12h hard) + BroadcastChannel,
                     # mock-login + OIDC button side-by-side (OIDC_CONFIG.enabled toggles)
  - websocket-live-updates  # EventSource at /events; approvals + notifications
                            # auto-refresh on absence.*, document.*, notification
                            # kinds. Polling stays as graceful-degradation fallback.
  - bulk-holiday-csv-import # admin upload + per-row diff preview (add | duplicate |
                            # invalid) before commit; forkJoin per-row applies
  - onboarding-tour         # 3-step popover anchored to nav links; first-login only;
                            # dismissable forever in localStorage
  - visual-regression       # Playwright toHaveScreenshot baselines for 5 routes × 2
                            # themes; tolerance 1% maxDiffPixelRatio
